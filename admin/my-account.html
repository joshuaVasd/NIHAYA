<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account - NIHAYA Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  </head>
  <body data-page="account">
    <div id="app-shell" class="app-shell">
      <div id="mobile-backdrop" class="mobile-backdrop hidden"></div>

      <!-- Left Forest-Green Sidebar Navigation -->
      <aside id="sidebar" class="sidebar" aria-label="Primary Navigation">
        <button id="mobile-close-btn" type="button" class="mobile-close-btn mobile-only" aria-label="Close navigation">
          <i data-lucide="x"></i>
        </button>

        <!-- Nihaya Logo at Top of Sidebar -->
        <a href="./dashboard.html" class="sidebar-brand" aria-label="NIHAYA Dashboard">
          <img src="./assets/images/nihaya-logo.png" alt="NIHAYA" />
        </a>

        <nav class="sidebar-nav" id="sidebar-nav">
          <a href="./dashboard.html" class="nav-pill" data-page="dashboard">
            <i data-lucide="home"></i>
            <span>Dashboard</span>
          </a>
          <a href="./products.html" class="nav-pill" data-page="products">
            <i data-lucide="layout-grid"></i>
            <span>Products</span>
          </a>
          <a href="./customers.html" class="nav-pill" data-page="customers">
            <i data-lucide="users"></i>
            <span>Customers</span>
          </a>
          <a href="./marketing.html" class="nav-pill" data-page="marketing">
            <i data-lucide="shopping-bag"></i>
            <span>Marketing</span>
          </a>
          <a href="./orders.html" class="nav-pill" data-page="orders">
            <i data-lucide="shopping-cart"></i>
            <span>Orders</span>
          </a>
        </nav>
      </aside>

      <div class="main-wrap">
        <!-- Top White Header Bar & Admin Profile Dropdown -->
        <header class="topbar" id="topbar">
          <div class="topbar-left">
            <span class="topbar-title">Dashboard</span>
          </div>

          <div class="topbar-right">
            <div class="profile-anchor">
              <button id="profile-btn" type="button" class="profile-trigger">
                <span id="topbar-avatar" class="profile-orb">A</span>
                <span class="profile-meta">
                  <span id="topbar-admin-name" class="profile-name">Admin</span>
                  <span class="profile-role">Admin</span>
                </span>
                <i data-lucide="chevron-down" class="profile-chevron"></i>
              </button>

              <div id="profile-popover" class="profile-popover hidden">
                <div class="popover-user">
                  <strong id="dropdown-admin-name">Admin</strong>
                  <span id="dropdown-admin-email"></span>
                </div>
                <button type="button" class="popover-link" id="dropdown-account-btn">
                  <i data-lucide="user"></i>
                  My account
                </button>
                <button type="button" class="popover-link danger" id="dropdown-logout-btn">
                  <i data-lucide="log-out"></i>
                  Log out
                </button>
              </div>
            </div>
          </div>
        </header>

        <!-- Dynamic Page Content (rendered by js/app.js) -->
        <main id="page-root" class="page-root"></main>
      </div>
    </div>

    <!-- Shared Modal Overlay (Customer Details, Order Details, Forms) -->
    <div id="modal-root" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop" data-modal-close></div>
      <div id="modal-box" class="modal-box">
        <div class="modal-header">
          <div>
            <h2 id="modal-title" class="modal-title"></h2>
            <p id="modal-subtitle" class="modal-subtitle"></p>
          </div>
          <button type="button" class="modal-close" data-modal-close aria-label="Close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-footer" class="modal-footer hidden"></div>
      </div>
    </div>

    <!-- Confirmation Dialog for Destructive Actions -->
    <div id="confirm-root" class="modal-overlay hidden" role="alertdialog" aria-modal="true">
      <div class="modal-backdrop" data-confirm-close></div>
      <div class="modal-box modal-sm">
        <div class="modal-header">
          <h2 id="confirm-title" class="modal-title">Confirm</h2>
          <button type="button" class="modal-close" data-confirm-close aria-label="Close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal-body">
          <p id="confirm-message" class="confirm-text"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-outline" data-confirm-close>Cancel</button>
          <button type="button" id="confirm-ok-btn" class="btn-danger">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Optional gitignored local-dev admin config (ignored if absent in production) -->
    <script src="./js/local-auth.secret.js"></script>
    <!-- Single backend-ready application script -->
    <script src="./js/app.js"></script>
  </body>
</html>
