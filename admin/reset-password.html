<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Set new password · NIHAYA Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="auth-page" data-auth-page="reset-password">
    <header class="auth-header">
      <a href="./login.html" class="topbar-logo">
        <img src="./assets/images/nihaya-logo.png" alt="NIHAYA" />
      </a>
    </header>

    <main class="auth-main">
      <form class="auth-card" id="rp-form" novalidate>
        <h1>Set new password</h1>
        <p class="auth-lead">Choose a new password for your admin account.</p>

        <div class="auth-field">
          <div class="auth-label-row">
            <label class="field-label" for="rp-new">New password</label>
            <button type="button" class="show-pw-btn" data-toggle-pw="rp-new">Show</button>
          </div>
          <input
            class="figma-input"
            id="rp-new"
            type="password"
            autocomplete="new-password"
            placeholder="Enter a new password"
          />
          <p class="auth-error hidden" id="rp-new-error"></p>
        </div>

        <p class="auth-note" style="margin: 0 0 14px">
          Use a long, unique password you don’t use elsewhere.
        </p>

        <div class="auth-field">
          <div class="auth-label-row">
            <label class="field-label" for="rp-confirm">Confirm new password</label>
            <button type="button" class="show-pw-btn" data-toggle-pw="rp-confirm">Show</button>
          </div>
          <input
            class="figma-input"
            id="rp-confirm"
            type="password"
            autocomplete="new-password"
            placeholder="Re-enter the new password"
          />
          <p class="auth-error hidden" id="rp-confirm-error"></p>
        </div>

        <button type="submit" class="btn-solid btn-full">Reset password</button>

        <div class="auth-links">
          <a href="./login.html">Back to login</a>
        </div>
      </form>

      <section class="auth-card hidden" id="rp-done">
        <h1>Password updated</h1>
        <p class="auth-lead">Your password has been changed. Log in with your new password.</p>
        <a href="./login.html" class="btn-solid btn-full">Back to login</a>
      </section>
    </main>

    <!-- Single backend-ready application script -->
    <script src="./js/app.js"></script>
  </body>
</html>
